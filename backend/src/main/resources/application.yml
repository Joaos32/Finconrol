spring:
  application:
    name: fincontrol-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fincontrol}
    username: ${DATABASE_USERNAME:fincontrol}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
fincontrol:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
